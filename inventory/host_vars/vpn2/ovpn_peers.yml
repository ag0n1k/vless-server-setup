---
# OpenVPN-клиенты на vpn2.
# Источник правды по PKI — сам сервер vpn2.
#
# Пример записи:
#   - cn: client1
#     state: present
#     fixed_ip: 10.88.0.10        # опционально: статический IP
#     iroute:                     # опционально: site-to-site
#       - 192.168.10.0/24
#     note: "комментарий"
#
# Чтобы добавить: ansible-playbook playbooks/add-ovpn-client.yml -e cn=<имя> -e target=vpn2

ovpn_peers:
  - cn: fast-hopper
    state: present
    # Site-to-site: роутер LAN-A. fixed_ip нужен, чтобы iroute всегда
    # соответствовал одному и тому же концу туннеля. .200 — заведомо выше
    # зоны, которую сервер раздаёт динамически телефонам (.2 и дальше).
    fixed_ip: "{{ hopper_vpn_ip }}"
    iroute:
      - 192.168.1.0/24
    note: "router LAN-A (192.168.1.0/24)"
  - cn: iphone-ag0n1k
    state: present
  - cn: iphone-olga
    state: present
  - cn: ipad-olga
    state: present
  - cn: ipad-mini
    state: present
