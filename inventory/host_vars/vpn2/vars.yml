---
# Имя хоста для логов/комментариев в шаблонах.
inventory_hostname_label: vpn2

# Публичный endpoint, используемый клиентами OVPN/WG. По умолчанию равен ansible_host.
server_public_ip: "{{ ansible_host }}"

# Имя WAN-интерфейса. Если пусто — определится автоматически (роль common).
#wan_iface: eth0

# Public key WG-сервера (известно из `wg show wg0 public-key`).
# Используется только для выдачи новым WG-клиентам — НЕ как источник правды.
# Реальная истина — приватник в /etc/wireguard/server.key на сервере.
wg_server_pubkey: L+F3LDK6IKZyFcHG8o5cLbi4TuM+5Blr7dmzGs0C30k=

# Public key wg1-сервера (WDTT-туннель). Используется add-wdtt-peer.yml
# для генерации клиентских конфигов.
wdtt_wg_server_pub: 029Do1cME3DerDVIm1kU9/E1cNeSDBKwR/dZdqOnmg0=

# Self-check: на vpn2 каркас в синхроне с сервером, безопасно крутить
# периодическую проверку egress + tproxy инвариантов.
selfcheck_enabled: true

# Auto-recover: при 3 подряд egress-провалах self-check сам дёргает
# sb_recover.py и пробует следующие ноды.
selfcheck_auto_switch_enabled: true

# Telegram-нотификации о падающих юнитах (бот @remember_be_bot, тот же что
# и у psn-watch). Токен/chat_id — в vault_tg_token / vault_tg_chat_id.
# OnFailure повешан через drop-in'ы на список юнитов ниже — шаблоны
# самих юнитов не трогаем.
#
# vpn-selfcheck.service СОЗНАТЕЛЬНО исключён: сам скрипт умеет звать
# notify-tg.sh при пересечении selfcheck_alert_threshold подряд-фейлов
# (одиночные таймауты egress не должны будить). Если хочется вернуть
# алёрт-на-каждый-fail — дописать обратно в этот список.
# ВАЖНО: при первом apply после удаления — руками снести
# /etc/systemd/system/vpn-selfcheck.service.d/notify.conf и `daemon-reload`,
# роль notify пока не purge'ит drop-in'ы.
notify_enabled: true
notify_units:
  - openvpn-server@server.service
  - wg-quick@wg0.service
  - wg-quick@wg1.service
  - sing-box.service
  - sing-box-refresh.service
  - vk-turn-proxy.service
  - fail2ban.service
  - nftables.service

# ── Site-to-site: LAN-A ↔ LAN-B через vpn2 ───────────────────────────
# LAN-A — сеть за роутером hopper, приходит по OpenVPN (tun0).
# LAN-B — сеть за роутером giga,   приходит по WireGuard (wg0).
# Подсети РАЗНЫЕ (192.168.1/24 и 192.168.2/24) — обязательное условие,
# при совпадении маршрутизация между площадками невозможна в принципе.
#
# Три уровня маршрутов, нужны все три:
#   1. iroute в CCD fast-hopper  → ovpn_peers.yml
#   2. route/AllowedIPs на vpn2  → openvpn_routes (ниже) + wg_peers.yml
#   3. обратный путь на той стороне → push route (ниже) + AllowedIPs
#      в клиентском конфиге giga (правится на роутере вручную)
lan_hopper: 192.168.1.0/24
lan_giga: 192.168.2.0/24

# Фиксированный адрес роутера LAN-A внутри туннеля. Используется дважды:
# как fixed_ip в ovpn_peers.yml и как gw маршрута ниже — поэтому переменная,
# а не литерал в двух местах.
hopper_vpn_ip: 10.88.0.200

# LAN-A лежит за OVPN-клиентом → ядру нужен route через tun0.
# gw обязателен: без него маршрут повиснет на первом адресе пула и после
# отключения роутера уведёт трафик к случайному клиенту (см. server.conf.j2).
openvpn_routes:
  - net: "{{ lan_hopper }}"
    gw: "{{ hopper_vpn_ip }}"

# Что раздаём OVPN-клиентам: LAN-B и WG-подсеть.
# lan_hopper здесь СОЗНАТЕЛЬНО отсутствует — телефон, физически стоящий
# в LAN-A, получил бы маршрут на собственную сеть через туннель.
openvpn_push_routes:
  - "{{ lan_giga }}"
  - "{{ wg_subnet }}"
