---
# WireGuard-пиры на wg0 (10.188.0.0/24) сервера vpn2.
# PSK хранятся в group_vars/all/vault.yml как vault_wg_peer_psks (мап pubkey→psk).
#
# Пример записи:
#   - name: phone1
#     pubkey: <публичный ключ клиента>
#     allowed_ips:
#       - 10.188.0.10/32
#     persistent_keepalive: 25
#     state: present
#
# Чтобы добавить: ansible-playbook playbooks/add-wg-peer.yml -e name=<...> -e wg_ip=<...> -e vpn_server=vpn2

wg_peers:
  - name: fast-giga
    pubkey: YdqSe5/kStHBYP/NlpIEAO8ZlKzxaFJo+zZUTnGM61k=
    allowed_ips:
      - 10.188.0.4/32
      # Site-to-site: LAN-B за этим роутером. wg-quick сам поставит
      # route 192.168.2.0/24 dev wg0 — отдельная директива не нужна.
      - 192.168.2.0/24
    persistent_keepalive: 25
    state: present

  - name: fast-hopper
    # Роутер LAN-A, site-to-site плечо на WireGuard.
    #
    # OVPN-конфигурация для этого же роутера СОЗНАТЕЛЬНО оставлена нетронутой
    # (серт, route, iroute в CCD): откат — просто включить OpenVPN обратно
    # на роутере, на сервере менять нечего. Пока OVPN-клиент не подключён,
    # его маршрут на 192.168.1.0/24 неактивен (learn'ится только вместе с
    # сессией), а статический route идёт с metric 200 против metric 0 у
    # wg-quick — так что WG выигрывает и конфликта маршрутов нет.
    pubkey: v/dw2OnyvT6ZYH8boZPmw+6DMkiTQzA7ZzHvl1njT1o=
    allowed_ips:
      - 10.188.0.5/32
      - 192.168.1.0/24
    persistent_keepalive: 25
    state: present
