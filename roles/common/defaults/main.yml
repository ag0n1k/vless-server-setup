---
# journald ───────────────────────────────────────────────────────────
# Потолок persistent-журнала. Без него журнал на vpn2 дорос до 1.9G при 1G RAM:
# любой `journalctl -u … --since …` читал файлы с диска, IO pressure уходила
# в ~95%, ssh-логины висели минутами. sing-box на log_level=info пишет строку
# на каждое соединение (~90 МБ/сутки) — 200M это примерно 2 суток истории.
journald_system_max_use: 200M
# Не дать одному файлу съесть весь бюджет: ротация на 1/8 лимита.
journald_system_max_file_size: 25M
